<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --bg2: #16161d;
    --bg3: #1e1e28;
    --line: #2e2e3a;
    --accent: #c4b0f5;
    --accent-dim: rgba(196,176,245,0.12);
    --accent-hover: #d5c8f9;
    --danger: #f08080;
    --danger-dim: rgba(240,128,128,0.1);
    --success: #80f0b0;
    --text: #e8e6f0;
    --muted: #6b6a7a;
    --font-body: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --radius: 6px;
    --transition: 0.2s ease;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 5rem;
  }

  /* ── HEADER ── */
  .page-header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .page-title {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .page-subtitle {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    margin-top: 0.5rem;
    letter-spacing: 0.05em;
  }

  /* ── MAIN LAYOUT ── */
  .app-wrap {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  /* ── CARD ── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .card-header {
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card-title span {
    color: var(--accent);
    margin-right: 0.5rem;
  }

  /* ── FORM ── */
  .form-body {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .form-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .form-input {
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color var(--transition), background var(--transition);
    width: 100%;
  }

  .form-input::placeholder { color: var(--muted); }
  .form-input:focus { border-color: var(--accent); background: var(--bg2); }
  .form-input.error { border-color: var(--danger); }

  .field-error {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--danger);
    letter-spacing: 0.05em;
    min-height: 14px;
  }

  .btn-add {
    background: var(--accent);
    color: #0f0f13;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 12px 20px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background var(--transition), transform var(--transition);
    width: 100%;
    margin-top: 0.25rem;
  }

  .btn-add:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-add .btn-icon { font-size: 14px; }

  /* ── SEARCH ── */
  .search-wrap {
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }

  .search-input {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 14px 10px 38px;
    outline: none;
    transition: border-color var(--transition);
    width: 100%;
  }

  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }

  /* ── COUNT BAR ── */
  .count-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 0.25rem;
  }

  .count-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .count-num {
    color: var(--accent);
    font-weight: 500;
  }

  /* ── CONTACT LIST ── */
  .contact-list {
    list-style: none;
    display: flex;
    flex-direction: column;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--line);
    transition: background var(--transition);
    animation: slideIn 0.25s ease;
  }

  .contact-item:last-child { border-bottom: none; }
  .contact-item:hover { background: var(--bg3); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .contact-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent-dim);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .contact-info {
    flex: 1;
    min-width: 0;
  }

  .contact-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .contact-meta {
    display: flex;
    gap: 1rem;
    margin-top: 2px;
    flex-wrap: wrap;
  }

  .contact-meta-item {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.03em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .contact-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn-icon-only {
    width: 32px;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all var(--transition);
  }

  .btn-icon-only.delete:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: var(--danger-dim);
  }

  .btn-icon-only.edit:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  /* ── EMPTY / LOADING STATES ── */
  .state-box {
    padding: 3rem 1.5rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  .state-icon { font-size: 2rem; opacity: 0.4; }

  .state-text {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── TOAST ── */
  .toast-wrap {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 999;
    pointer-events: none;
  }

  .toast {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 10px 18px;
    border-radius: var(--radius);
    border: 1px solid;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
    white-space: nowrap;
  }

  .toast.success { background: rgba(128,240,176,0.1); border-color: var(--success); color: var(--success); }
  .toast.error   { background: rgba(240,128,128,0.1); border-color: var(--danger);  color: var(--danger);  }

  @keyframes toastIn  { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
  @keyframes toastOut { from { opacity:1; } to { opacity:0; } }

  /* ── EDIT MODAL ── */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    width: 100%;
    max-width: 440px;
    animation: modalIn 0.25s ease;
  }

  @keyframes modalIn { from { opacity:0; transform: scale(0.96); } to { opacity:1; transform: scale(1); } }

  .modal-header {
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 2px 6px;
    transition: color var(--transition);
  }

  .modal-close:hover { color: var(--text); }

  .modal-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }

  .modal-actions {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 0.75rem;
    justify-content: flex-end;
  }

  .btn-cancel {
    background: transparent;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--transition);
  }

  .btn-cancel:hover { border-color: var(--muted); color: var(--text); }

  .btn-save {
    background: var(--accent);
    color: #0f0f13;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 18px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background var(--transition);
  }

  .btn-save:hover { background: var(--accent-hover); }

  /* ── FIREBASE NOTICE ── */
  .firebase-notice {
    background: rgba(196,176,245,0.06);
    border: 1px solid rgba(196,176,245,0.2);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    line-height: 1.8;
    letter-spacing: 0.04em;
  }

  .firebase-notice strong { color: var(--accent); }

  @media (max-width: 500px) {
    .form-row { grid-template-columns: 1fr; }
    .contact-meta { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>

<div class="page-header">
  <h1 class="page-title">Contact Book</h1>
  <p class="page-subtitle">Firebase Firestore · Real-time Database</p>
</div>

<div class="app-wrap">

  <!-- Firebase config notice -->
  <div class="firebase-notice" id="configNotice">
    ⚠ &nbsp;<strong>Setup required:</strong> Replace the placeholder values in the <code>firebaseConfig</code> object at the bottom of this file with your real Firebase project keys. See the instructions on the portfolio page.
  </div>

  <!-- ADD CONTACT CARD -->
  <div class="card">
    <div class="card-header">
      <span class="card-title"><span>+</span> Add New Contact</span>
    </div>
    <div class="form-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="inp-name">Full Name</label>
          <input class="form-input" id="inp-name" type="text" placeholder="Jane Smith" autocomplete="off">
          <span class="field-error" id="err-name"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="inp-phone">Phone</label>
          <input class="form-input" id="inp-phone" type="tel" placeholder="+27 82 000 0000" autocomplete="off">
          <span class="field-error" id="err-phone"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="inp-email">Email Address</label>
        <input class="form-input" id="inp-email" type="email" placeholder="jane@example.com" autocomplete="off">
        <span class="field-error" id="err-email"></span>
      </div>
      <button class="btn-add" id="addBtn" onclick="handleAdd()">
        <span class="btn-icon">＋</span> Add Contact
      </button>
    </div>
  </div>

  <!-- CONTACT LIST CARD -->
  <div class="card">
    <div class="card-header">
      <span class="card-title"><span>◈</span> Contacts</span>
    </div>
    <div style="padding: 1rem 1.5rem; border-bottom: 1px solid var(--line);">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" id="searchInput" type="text" placeholder="Search by name, email or phone..." oninput="renderList()">
      </div>
    </div>
    <div style="padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--line);" class="count-bar">
      <span class="count-label">Total: <span class="count-num" id="countNum">0</span></span>
      <span class="count-label" id="filterLabel"></span>
    </div>
    <ul class="contact-list" id="contactList"></ul>
  </div>

</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Edit Contact</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-input" id="edit-name" type="text" placeholder="Jane Smith">
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" id="edit-email" type="email" placeholder="jane@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input class="form-input" id="edit-phone" type="tel" placeholder="+27 82 000 0000">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyCOOguxN3mz9qUC6AH5ZKClwMkC3sOTtWE",
    authDomain:        "contactbook-f9e55.firebaseapp.com",
    projectId:         "contactbook-f9e55",
    storageBucket:     "contactbook-f9e55.firebasestorage.app",
    messagingSenderId: "578806050985",
    appId:             "1:578806050985:web:f02f8d4f89e063fda679b8"
  };
  

  // ── Init ──
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COL = 'contacts';

  // ── State ──
  let contacts = [];    
  let editingId = null;    

  // ── Firestore: real-time listener ──
  db.collection(COL).orderBy('name').onSnapshot(snapshot => {
    contacts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderList();
  }, err => {
    console.error(err);
    showToast('Failed to connect to database. Check your Firebase config.', 'error');
  });

  // ── Render list ──
  function renderList() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const filtered = query
      ? contacts.filter(c =>
          c.name?.toLowerCase().includes(query) ||
          c.email?.toLowerCase().includes(query) ||
          c.phone?.toLowerCase().includes(query))
      : contacts;

    document.getElementById('countNum').textContent = contacts.length;
    document.getElementById('filterLabel').textContent =
      query ? `Showing ${filtered.length} result${filtered.length !== 1 ? 's' : ''}` : '';

    const list = document.getElementById('contactList');

    if (contacts.length === 0) {
      list.innerHTML = `
        <li style="list-style:none">
          <div class="state-box">
            <span class="state-icon">📭</span>
            <span class="state-text">No contacts yet — add one above.</span>
          </div>
        </li>`;
      return;
    }

    if (filtered.length === 0) {
      list.innerHTML = `
        <li style="list-style:none">
          <div class="state-box">
            <span class="state-icon">🔍</span>
            <span class="state-text">No contacts match your search.</span>
          </div>
        </li>`;
      return;
    }

    list.innerHTML = filtered.map(c => `
      <li class="contact-item">
        <div class="contact-avatar">${initials(c.name)}</div>
        <div class="contact-info">
          <div class="contact-name">${escHtml(c.name)}</div>
          <div class="contact-meta">
            <span class="contact-meta-item">✉ ${escHtml(c.email)}</span>
            <span class="contact-meta-item">✆ ${escHtml(c.phone)}</span>
          </div>
        </div>
        <div class="contact-actions">
          <button class="btn-icon-only edit" onclick="openEdit('${c.id}')" title="Edit">✎</button>
          <button class="btn-icon-only delete" onclick="handleDelete('${c.id}', '${escHtml(c.name)}')" title="Delete">✕</button>
        </div>
      </li>
    `).join('');
  }

  // ── Add contact ──
  async function handleAdd() {
    const name  = document.getElementById('inp-name').value.trim();
    const email = document.getElementById('inp-email').value.trim();
    const phone = document.getElementById('inp-phone').value.trim();

    clearErrors();

    let valid = true;

    if (!name) {
      setError('err-name', 'Name is required');
      document.getElementById('inp-name').classList.add('error');
      valid = false;
    }

    if (!email) {
      setError('err-email', 'Email is required');
      document.getElementById('inp-email').classList.add('error');
      valid = false;
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setError('err-email', 'Enter a valid email address');
      document.getElementById('inp-email').classList.add('error');
      valid = false;
    }

    if (!phone) {
      setError('err-phone', 'Phone is required');
      document.getElementById('inp-phone').classList.add('error');
      valid = false;
    }

    if (!valid) return;

    // Check duplicate email
    const duplicate = contacts.find(c => c.email.toLowerCase() === email.toLowerCase());
    if (duplicate) {
      setError('err-email', 'A contact with this email already exists');
      document.getElementById('inp-email').classList.add('error');
      return;
    }

    const btn = document.getElementById('addBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      await db.collection(COL).add({ name, email, phone, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      document.getElementById('inp-name').value = '';
      document.getElementById('inp-email').value = '';
      document.getElementById('inp-phone').value = '';
      showToast(`${name} added successfully.`, 'success');
    } catch (err) {
      console.error(err);
      showToast('Failed to add contact. Check your Firebase config.', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span class="btn-icon">＋</span> Add Contact';
    }
  }

  async function handleDelete(id, name) {
    if (!confirm(`Delete ${name}?`)) return;
    try {
      await db.collection(COL).doc(id).delete();
      showToast(`${name} deleted.`, 'success');
    } catch (err) {
      console.error(err);
      showToast('Failed to delete contact.', 'error');
    }
  }

  function openEdit(id) {
    const c = contacts.find(c => c.id === id);
    if (!c) return;
    editingId = id;
    document.getElementById('edit-name').value  = c.name;
    document.getElementById('edit-email').value = c.email;
    document.getElementById('edit-phone').value = c.phone;
    document.getElementById('editModal').classList.add('open');
  }

  function closeModal() {
    editingId = null;
    document.getElementById('editModal').classList.remove('open');
  }

  async function saveEdit() {
    const name  = document.getElementById('edit-name').value.trim();
    const email = document.getElementById('edit-email').value.trim();
    const phone = document.getElementById('edit-phone').value.trim();

    if (!name || !email || !phone) { showToast('All fields are required.', 'error'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Invalid email address.', 'error'); return; }

    try {
      await db.collection(COL).doc(editingId).update({ name, email, phone });
      showToast('Contact updated.', 'success');
      closeModal();
    } catch (err) {
      console.error(err);
      showToast('Failed to update contact.', 'error');
    }
  }

  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  function initials(name = '') {
    return name.split(' ').slice(0,2).map(w => w[0] || '').join('').toUpperCase() || '?';
  }

  function escHtml(str = '') {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function setError(id, msg) {
    document.getElementById(id).textContent = msg;
  }

  function clearErrors() {
    ['err-name','err-email','err-phone'].forEach(id => document.getElementById(id).textContent = '');
    ['inp-name','inp-email','inp-phone'].forEach(id => document.getElementById(id).classList.remove('error'));
  }

  function showToast(msg, type = 'success') {
    const wrap = document.getElementById('toastWrap');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  db.collection(COL).limit(1).get()
    .then(() => document.getElementById('configNotice').style.display = 'none')
    .catch(() => {});
</script>

</body>
</html>
